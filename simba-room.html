<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Комната Симбы</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    font-family: Georgia, serif;
    background: #1a1510;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .room-header {
    background: #1a1510;
    color: #f1e8db;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    z-index: 10;
    border-bottom: 2px solid #b84a2d;
  }
  .room-header h1 {
    font-size: 18px;
    font-weight: 400;
  }
  .room-header h1 em {
    color: #b84a2d;
    font-style: italic;
  }
  .back-btn {
    background: #b84a2d;
    color: #f1e8db;
    border: 2px solid #f1e8db;
    padding: 6px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    text-decoration: none;
  }
  .back-btn:active { transform: scale(0.95); }

  .room {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  /* Стена */
  .wall {
    position: absolute;
    top: 0;
    width: 100%;
    height: 55%;
    background: linear-gradient(to bottom, #e8dcc8 0%, #d4c4a8 100%);
  }

  /* Пол */
  .floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 45%;
    background: 
      repeating-linear-gradient(
        90deg,
        #8b7355 0px,
        #8b7355 60px,
        #7a6245 60px,
        #7a6245 62px
      );
    box-shadow: inset 0 20px 40px rgba(0,0,0,0.3);
  }

  /* Коврик */
  .rug {
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 30%;
    background: radial-gradient(ellipse, #b84a2d 0%, #963a22 60%, #7a2e1a 100%);
    border-radius: 50%;
    opacity: 0.6;
    border: 3px dashed #f1e8db;
  }

  /* Окно */
  .window {
    position: absolute;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 110px;
    background: linear-gradient(to bottom, #87ceeb 0%, #b0e0e6 100%);
    border: 10px solid #5a4a3a;
    border-radius: 4px;
    box-shadow: inset 0 0 20px rgba(255,255,255,0.3), 0 4px 10px rgba(0,0,0,0.3);
  }
  .window::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    width: 4px;
    height: 100%;
    background: #5a4a3a;
    transform: translateX(-50%);
  }
  .window::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 4px;
    background: #5a4a3a;
    transform: translateY(-50%);
  }

  /* Солнышко в окне */
  .sun {
    position: absolute;
    top: 15%;
    right: 15%;
    width: 25px;
    height: 25px;
    background: #ffd700;
    border-radius: 50%;
    box-shadow: 0 0 15px #ffd700;
  }

  /* Полка */
  .shelf {
    position: absolute;
    top: 25%;
    left: 10%;
    width: 100px;
    height: 8px;
    background: #5a4a3a;
    border-radius: 2px;
    box-shadow: 0 3px 5px rgba(0,0,0,0.3);
  }
  .book {
    position: absolute;
    bottom: 8px;
    width: 12px;
    height: 35px;
    border-radius: 2px;
  }
  .book:nth-child(1) { left: 10px; background: #b84a2d; }
  .book:nth-child(2) { left: 25px; background: #2a5a3a; }
  .book:nth-child(3) { left: 40px; background: #3a4a6a; }
  .book:nth-child(4) { left: 55px; background: #d9a441; }

  /* Картина */
  .picture {
    position: absolute;
    top: 15%;
    right: 15%;
    width: 70px;
    height: 80px;
    background: #f7f1e6;
    border: 6px solid #5a4a3a;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }

  /* Подушка */
  .pillow {
    position: absolute;
    bottom: 15%;
    left: 15%;
    width: 100px;
    height: 50px;
    background: linear-gradient(135deg, #d9a441 0%, #b8862d 100%);
    border-radius: 50%;
    border: 3px solid #8b6a1a;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    cursor: pointer;
    z-index: 3;
  }
  .pillow::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 30px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
  }

  /* Игрушки */
  .toy {
    position: absolute;
    font-size: 45px;
    cursor: pointer;
    z-index: 4;
    transition: transform 0.3s;
    filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.4));
  }
  .toy:active { transform: scale(1.3) rotate(10deg); }
  .toy:hover { transform: scale(1.15); }

  /* Кот */
  .cat {
    position: absolute;
    width: 120px;
    height: auto;
    z-index: 5;
    transition: left 1.5s ease-in-out, bottom 1.5s ease-in-out;
    filter: drop-shadow(3px 5px 6px rgba(0,0,0,0.4));
    cursor: pointer;
  }
  .cat img {
    width: 100%;
    display: block;
  }
  .cat.walking {
    animation: bob 0.4s ease-in-out infinite;
  }
  .cat.flipped img {
    transform: scaleX(-1);
  }
  .cat.playing {
    animation: wiggle 0.5s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  /* Текст действия */
  .action-text {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(26, 21, 16, 0.92);
    color: #f1e8db;
    padding: 14px 28px;
    border-radius: 14px;
    font-size: 17px;
    font-family: Georgia, serif;
    font-style: italic;
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 20;
    pointer-events: none;
    border: 2px solid #b84a2d;
    white-space: nowrap;
  }
  .action-text.visible { opacity: 1; }

  .sound-toggle {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    margin-right: 10px;
  }

  /* Подсказка */
  .hint {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(184, 74, 45, 0.9);
    color: #f1e8db;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    z-index: 15;
    opacity: 0;
    transition: opacity 1s;
  }
  .hint.visible { opacity: 1; }
</style>
</head>
<body>

  <div class="room-header">
    <h1>Комната <em>Симбы</em> </h1>
    <div>
      <button class="sound-toggle" id="soundBtn" onclick="toggleSound()">🔊</button>
      <a href="simba-3.04.html" class="back-btn">← Назад</a>
    </div>
  </div>

  <div class="room" id="room">
    <div class="wall"></div>
    <div class="floor"></div>
    <div class="rug"></div>

    <div class="window">
      <div class="sun"></div>
    </div>

    <div class="shelf">
      <div class="book"></div>
      <div class="book"></div>
      <div class="book"></div>
      <div class="book"></div>
    </div>

    <div class="picture">🐾</div>

    <div class="pillow" id="pillow" onclick="goToPillow(event)"></div>

    <!-- Игрушки -->
    <div class="toy" id="toy-yarn" style="bottom: 20%; right: 20%;" onclick="goToToy(event, 'yarn')">🧶</div>
    <div class="toy" id="toy-box" style="bottom: 25%; right: 35%;" onclick="goToToy(event, 'box')">📦</div>
    <div class="toy" id="toy-rod" style="bottom: 30%; left: 40%;" onclick="goToToy(event, 'rod')">🎣</div>
    <div class="toy" id="toy-mouse" style="bottom: 18%; left: 55%;" onclick="goToToy(event, 'mouse')">🐭</div>

    <!-- Кот -->
    <div class="cat" id="cat">
      <img id="catImg" src="https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-lie.png" alt="Симба">
    </div>

    <div class="hint visible" id="hint">Нажми куда-нибудь — Симба пойдёт туда!</div>
    <div class="action-text" id="actionText"></div>
  </div>

<script>
  // === НАСТРОЙКИ ===
  const IMG_LIE = 'https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-lie.png';
  const IMG_SIT = 'https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-sit.png';
  const IMG_WALK = 'https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-walk.png';
  const IMG_PLAY = 'https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-play.png';

  const TOY_NAMES = {
    yarn: 'клубком ниток ',
    box: 'коробкой 📦',
    rod: 'удочкой 🎣',
    mouse: 'мышкой '
  };

  const cat = document.getElementById('cat');
  const catImg = document.getElementById('catImg');
  const room = document.getElementById('room');
  const actionText = document.getElementById('actionText');
  const hint = document.getElementById('hint');
  const pillow = document.getElementById('pillow');

  let soundOn = true;
  let isMoving = false;
  let audioCtx = null;

  // === ЗВУКИ ЧЕРЕЗ WEB AUDIO API ===
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playMeow() {
    if (!soundOn) return;
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
    osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.3);
    
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.4);
  }

  function playPurr() {
    if (!soundOn) return;
    initAudio();
    const bufferSize = audioCtx.sampleRate * 1.5;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.1;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 200;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
  }

  function toggleSound() {
    soundOn = !soundOn;
    document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '';
  }

  // === ДВИЖЕНИЕ КОТА ===
  function setCatImage(src) {
    catImg.src = src;
  }

  function showAction(text) {
    actionText.textContent = text;
    actionText.classList.add('visible');
    setTimeout(() => actionText.classList.remove('visible'), 2500);
  }

  function flipCat(direction) {
    if (direction === 'left') {
      cat.classList.add('flipped');
    } else {
      cat.classList.remove('flipped');
    }
  }

  function moveCatTo(x, y, callback) {
    if (isMoving) return;
    isMoving = true;

    const roomRect = room.getBoundingClientRect();
    const catRect = cat.getBoundingClientRect();

    // Текущая позиция
    const currentX = cat.offsetLeft;
    const currentY = roomRect.height - cat.offsetTop - catRect.height;

    // Направление
    const direction = x < currentX ? 'left' : 'right';
    flipCat(direction);

    // Встаёт
    setCatImage(IMG_SIT);
    playMeow();

    setTimeout(() => {
      // Идёт
      setCatImage(IMG_WALK);
      cat.classList.add('walking');

      // Двигаем
      cat.style.left = (x - 60) + 'px';
      cat.style.bottom = y + 'px';

      // Время движения зависит от расстояния
      const distance = Math.abs(x - currentX);
      const duration = Math.max(1000, distance * 3);
      cat.style.transition = `left ${duration}ms ease-in-out, bottom ${duration}ms ease-in-out`;

      setTimeout(() => {
        cat.classList.remove('walking');
        if (callback) callback();
        isMoving = false;
      }, duration);
    }, 400);
  }

  function goToPillow(event) {
    event.stopPropagation();
    if (isMoving) return;
    hideHint();

    const pillowRect = pillow.getBoundingClientRect();
    const roomRect = room.getBoundingClientRect();
    const x = pillowRect.left - roomRect.left + 50;
    const y = roomRect.height - pillowRect.top + roomRect.top - 20;

    moveCatTo(x, y, () => {
      setCatImage(IMG_LIE);
      showAction('Симба отдыхает на подушке... 💤');
    });
  }

  function goToToy(event, toyName) {
    event.stopPropagation();
    if (isMoving) return;
    hideHint();

    const toy = document.getElementById('toy-' + toyName);
    const toyRect = toy.getBoundingClientRect();
    const roomRect = room.getBoundingClientRect();
    const x = toyRect.left - roomRect.left + 20;
    const y = roomRect.height - toyRect.top + roomRect.top - 10;

    moveCatTo(x, y, () => {
      setCatImage(IMG_PLAY);
      cat.classList.add('playing');
      playPurr();
      showAction('Симба играет с ' + TOY_NAMES[toyName] + '!');
      
      setTimeout(() => {
        cat.classList.remove('playing');
        setCatImage(IMG_SIT);
      }, 3000);
    });
  }

  // Клик по комнате
  room.addEventListener('click', (e) => {
    if (isMoving) return;
    if (e.target.classList.contains('toy') || e.target.id === 'pillow') return;
    hideHint();

    const roomRect = room.getBoundingClientRect();
    const x = e.clientX - roomRect.left;
    const y = roomRect.height - (e.clientY - roomRect.top);

    // Ограничиваем, чтобы кот не уходил за пределы
    const clampedY = Math.max(50, Math.min(y, roomRect.height * 0.45));

    moveCatTo(x, clampedY, () => {
      setCatImage(IMG_SIT);
      showAction('Симба сел и осматривается ');
    });
  });

  // Клик по коту
  cat.addEventListener('click', (e) => {
    e.stopPropagation();
    if (isMoving) return;
    playMeow();
    showAction('Мяу! ');
  });

  function hideHint() {
    hint.classList.remove('visible');
  }

  // Скрываем подсказку через 5 секунд
  setTimeout(hideHint, 5000);

  // Начальная позиция — на подушке
  window.addEventListener('load', () => {
    const pillowRect = pillow.getBoundingClientRect();
    const roomRect = room.getBoundingClientRect();
    const startX = pillowRect.left - roomRect.left + 10;
    const startY = roomRect.height - pillowRect.top + roomRect.top + 10;
    
    cat.style.left = startX + 'px';
    cat.style.bottom = startY + 'px';
    cat.style.transition = 'none';
  });
</script>

</body>
      </html>
