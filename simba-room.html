<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Комната Симбы</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: Georgia, serif;
  }

  body {
    display: flex;
    flex-direction: column;
    background: #1a1510;
  }

  .header {
    background: #1a1510;
    color: #f1e8db;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #b84a2d;
    flex-shrink: 0;
    z-index: 100;
  }
  .header h1 { font-size: 18px; font-weight: 400; }
  .header h1 em { color: #b84a2d; font-style: italic; }
  .header-btns { display: flex; gap: 10px; align-items: center; }
  .back-btn {
    background: #b84a2d;
    color: #f1e8db;
    border: 2px solid #f1e8db;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    text-decoration: none;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .sound-btn {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
  }

  .room {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background-image: url('https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/room-bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  .wall-zone {
    flex: 1;
    position: relative;
    min-height: 0;
  }

  .floor-zone {
    flex: 1;
    position: relative;
    min-height: 0;
    cursor: pointer;
  }

  /* Хитбокс дивана — подстроен под реальное фото */
  .sofa-hitbox {
    position: absolute;
    top: 10%;
    left: 5%;
    width: 90%;
    height: 50%;
    cursor: pointer;
    z-index: 5;
    /* background: rgba(255,0,0,0.3); */ /* раскомментируй чтобы увидеть зону */
  }

  .cat {
    position: absolute;
    width: 160px;
    height: auto;
    z-index: 10;
    filter: drop-shadow(3px 5px 8px rgba(0,0,0,0.6));
    cursor: pointer;
  }
  .cat img {
    width: 100%;
    display: block;
  }
  .cat.walking {
    animation: bob 0.3s ease-in-out infinite;
  }
  .cat.flipped img {
    transform: scaleX(-1);
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .action-text {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(26, 21, 16, 0.95);
    color: #f1e8db;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 15px;
    font-style: italic;
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 200;
    pointer-events: none;
    border: 2px solid #b84a2d;
    white-space: nowrap;
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .action-text.visible { opacity: 1; }

  .hint {
    position: fixed;
    top: 65px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(184, 74, 45, 0.95);
    color: #f1e8db;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    z-index: 150;
    opacity: 0;
    transition: opacity 1s;
    white-space: nowrap;
  }
  .hint.visible { opacity: 1; }
</style>
</head>
<body>

  <div class="header">
    <h1>Комната <em>Симбы</em> 🏠</h1>
    <div class="header-btns">
      <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
      <a href="simba-3.04.html" class="back-btn">← Назад</a>
    </div>
  </div>

  <div class="room" id="room">
    <div class="wall-zone" id="wallZone"></div>

    <div class="floor-zone" id="floorZone">
      <div class="sofa-hitbox" id="sofaHitbox" onclick="goToSofa(event)"></div>

      <div class="cat" id="cat">
        <img id="catImg" src="https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-lie.png" alt="Симба">
      </div>
    </div>
  </div>

  <div class="hint visible" id="hint">Нажми на диван — Симба ляжет отдыхать!</div>
  <div class="action-text" id="actionText"></div>

<script>
  const IMG_LIE = 'https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-lie.png';
  const IMG_SIT = 'https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-sit.png';
  const IMG_WALK = 'https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-walk.png';

  const CAT_WIDTH = 160;
  const CAT_HEIGHT = 120;

  const cat = document.getElementById('cat');
  const catImg = document.getElementById('catImg');
  const floorZone = document.getElementById('floorZone');
  const sofaHitbox = document.getElementById('sofaHitbox');
  const actionText = document.getElementById('actionText');
  const hint = document.getElementById('hint');

  let soundOn = true;
  let isMoving = false;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playMeow() {
    if (!soundOn) return;
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
    osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.4);
  }

  function toggleSound() {
    soundOn = !soundOn;
    document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  }

  function setCatImage(src) { catImg.src = src; }

  function showAction(text) {
    actionText.textContent = text;
    actionText.classList.add('visible');
    setTimeout(() => actionText.classList.remove('visible'), 2500);
  }

  function flipCat(direction) {
    if (direction === 'left') cat.classList.add('flipped');
    else cat.classList.remove('flipped');
  }

  function getCatPos() {
    const floorRect = floorZone.getBoundingClientRect();
    const catRect = cat.getBoundingClientRect();
    return {
      left: catRect.left - floorRect.left,
      top: catRect.top - floorRect.top
    };
  }

  function clampToFloor(x, y) {
    const floorRect = floorZone.getBoundingClientRect();
    const minX = 5;
    const maxX = floorRect.width - CAT_WIDTH - 5;
    x = Math.max(minX, Math.min(x, maxX));
    const minY = 5;
    const maxY = floorRect.height - CAT_HEIGHT - 5;
    y = Math.max(minY, Math.min(y, maxY));
    return { x, y };
  }

  function moveCatTo(targetX, targetY, callback) {
    if (isMoving) return;
    isMoving = true;

    const pos = getCatPos();
    const direction = targetX < pos.left ? 'left' : 'right';
    flipCat(direction);

    setCatImage(IMG_SIT);
    playMeow();

    setTimeout(() => {
      setCatImage(IMG_WALK);
      cat.classList.add('walking');

      const distance = Math.sqrt(Math.pow(targetX - pos.left, 2) + Math.pow(targetY - pos.top, 2));
      const duration = Math.max(600, distance * 2.5);

      cat.style.transition = `left ${duration}ms ease-in-out, top ${duration}ms ease-in-out`;
      cat.style.left = targetX + 'px';
      cat.style.top = targetY + 'px';

      setTimeout(() => {
        cat.classList.remove('walking');
        if (callback) callback();
        isMoving = false;
      }, duration);
    }, 300);
  }

  function goToSofa(event) {
    event.stopPropagation();
    if (isMoving) return;
    hideHint();

    const floorRect = floorZone.getBoundingClientRect();
    const sofaRect = sofaHitbox.getBoundingClientRect();
    
    const targetX = (sofaRect.left - floorRect.left) + (sofaRect.width / 2) - (CAT_WIDTH / 2);
    const targetY = (sofaRect.top - floorRect.top) + (sofaRect.height / 2) - (CAT_HEIGHT / 2);
    
    const clamped = clampToFloor(targetX, targetY);

    moveCatTo(clamped.x, clamped.y, () => {
      setCatImage(IMG_LIE);
      showAction('Симба отдыхает на диване... 💤');
    });
  }

  floorZone.addEventListener('click', (e) => {
    if (isMoving) return;
    if (e.target.id === 'sofaHitbox' || e.target.closest('.sofa-hitbox')) return;
    hideHint();

    const floorRect = floorZone.getBoundingClientRect();
    const clickX = e.clientX - floorRect.left - (CAT_WIDTH / 2);
    const clickY = e.clientY - floorRect.top - (CAT_HEIGHT / 2);
    
    const clamped = clampToFloor(clickX, clickY);

    moveCatTo(clamped.x, clamped.y, () => {
      setCatImage(IMG_SIT);
      showAction('Симба сел и осматривается 👀');
    });
  });

  cat.addEventListener('click', (e) => {
    e.stopPropagation();
    if (isMoving) return;
    playMeow();
    showAction('Мяу! 🐱');
  });

  function hideHint() { hint.classList.remove('visible'); }
  setTimeout(hideHint, 4000);

  window.addEventListener('load', () => {
    const floorRect = floorZone.getBoundingClientRect();
    const sofaRect = sofaHitbox.getBoundingClientRect();
    
    const startX = (sofaRect.left - floorRect.left) + (sofaRect.width / 2) - (CAT_WIDTH / 2);
    const startY = (sofaRect.top - floorRect.top) + (sofaRect.height / 2) - (CAT_HEIGHT / 2);
    
    const clamped = clampToFloor(startX, startY);
    
    cat.style.left = clamped.x + 'px';
    cat.style.top = clamped.y + 'px';
    cat.style.transition = 'none';
  });

  window.addEventListener('resize', () => {
    const pos = getCatPos();
    const clamped = clampToFloor(pos.left, pos.top);
    cat.style.transition = 'none';
    cat.style.left = clamped.x + 'px';
    cat.style.top = clamped.y + 'px';
  });
</script>

</body>
</html>
