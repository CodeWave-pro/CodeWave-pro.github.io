<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Комната Симбы</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: Georgia, serif;
  }

  body {
    display: flex;
    flex-direction: column;
    background: #1a1510;
  }

  .header {
    background: #1a1510;
    color: #f1e8db;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #b84a2d;
    flex-shrink: 0;
    z-index: 100;
  }
  .header h1 { font-size: 18px; font-weight: 400; }
  .header h1 em { color: #b84a2d; font-style: italic; }
  .header-btns { display: flex; gap: 10px; align-items: center; }
  .back-btn {
    background: #b84a2d;
    color: #f1e8db;
    border: 2px solid #f1e8db;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    text-decoration: none;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .sound-btn {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
  }

  .room {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .wall {
    flex: 1;
    background: linear-gradient(to bottom, #e8dcc8, #d4c4a8);
    position: relative;
    min-height: 0;
  }

  .floor {
    flex: 1;
    background: repeating-linear-gradient(90deg, #8b7355 0px, #8b7355 60px, #7a6245 60px, #7a6245 62px);
    position: relative;
    min-height: 0;
    box-shadow: inset 0 15px 30px rgba(0,0,0,0.4);
  }

  .rug {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 75%;
    height: 75%;
    background: radial-gradient(ellipse, #b84a2d, #963a22 60%, #7a2e1a);
    border-radius: 50%;
    opacity: 0.75;
    border: 3px dashed #f1e8db;
  }

  .window {
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 100px;
    background: linear-gradient(to bottom, #87ceeb, #b0e0e6);
    border: 8px solid #5a4a3a;
    border-radius: 4px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .window::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    width: 4px; height: 100%;
    background: #5a4a3a;
    transform: translateX(-50%);
  }
  .window::after {
    content: '';
    position: absolute;
    top: 50%; left: 0;
    width: 100%; height: 4px;
    background: #5a4a3a;
    transform: translateY(-50%);
  }
  .sun {
    position: absolute;
    top: 15%; right: 15%;
    width: 22px; height: 22px;
    background: #ffd700;
    border-radius: 50%;
    box-shadow: 0 0 15px #ffd700;
  }

  .shelf {
    position: absolute;
    top: 60%; left: 8%;
    width: 100px; height: 6px;
    background: #5a4a3a;
    border-radius: 2px;
    box-shadow: 0 3px 5px rgba(0,0,0,0.3);
  }
  .book {
    position: absolute;
    bottom: 6px;
    width: 11px; height: 32px;
    border-radius: 2px;
  }
  .book:nth-child(1) { left: 8px; background: #b84a2d; }
  .book:nth-child(2) { left: 24px; background: #2a5a3a; }
  .book:nth-child(3) { left: 40px; background: #3a4a6a; }
  .book:nth-child(4) { left: 56px; background: #d9a441; }

  .picture {
    position: absolute;
    top: 30%; right: 10%;
    width: 65px; height: 75px;
    background: #f7f1e6;
    border: 5px solid #5a4a3a;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }

  .pillow {
    position: absolute;
    top: 55%;
    left: 8%;
    width: 95px;
    height: 48px;
    background: linear-gradient(135deg, #d9a441, #b8862d);
    border-radius: 50%;
    border: 3px solid #8b6a1a;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    cursor: pointer;
    z-index: 3;
  }

  .toy {
    position: absolute;
    font-size: 48px;
    cursor: pointer;
    z-index: 4;
    filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.4));
    transition: transform 0.2s;
  }
  .toy:active { transform: scale(1.3); }

  .cat {
    position: absolute;
    width: 150px;
    height: auto;
    z-index: 10;
    filter: drop-shadow(3px 5px 6px rgba(0,0,0,0.5));
    cursor: pointer;
  }
  .cat img {
    width: 100%;
    display: block;
  }
  .cat.walking {
    animation: bob 0.3s ease-in-out infinite;
  }
  .cat.flipped img {
    transform: scaleX(-1);
  }
  .cat.playing {
    animation: wiggle 0.5s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  .action-text {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(26, 21, 16, 0.95);
    color: #f1e8db;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 15px;
    font-style: italic;
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 200;
    pointer-events: none;
    border: 2px solid #b84a2d;
    white-space: nowrap;
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .action-text.visible { opacity: 1; }

  .hint {
    position: fixed;
    top: 65px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(184, 74, 45, 0.95);
    color: #f1e8db;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    z-index: 150;
    opacity: 0;
    transition: opacity 1s;
    white-space: nowrap;
  }
  .hint.visible { opacity: 1; }
</style>
</head>
<body>

  <div class="header">
    <h1>Комната <em>Симбы</em> 🏠</h1>
    <div class="header-btns">
      <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
      <a href="simba-3.04.html" class="back-btn">← Назад</a>
    </div>
  </div>

  <div class="room">
    <div class="wall">
      <div class="window"><div class="sun"></div></div>
      <div class="shelf">
        <div class="book"></div>
        <div class="book"></div>
        <div class="book"></div>
        <div class="book"></div>
      </div>
      <div class="picture">🐾</div>
    </div>

    <div class="floor" id="floor">
      <div class="rug"></div>

      <div class="pillow" id="pillow" onclick="goToPillow(event)"></div>

      <div class="toy" id="toy-yarn" style="top: 60%; right: 12%;" onclick="goToToy(event, 'yarn')">🧶</div>
      <div class="toy" id="toy-box" style="top: 30%; right: 25%;" onclick="goToToy(event, 'box')">📦</div>
      <div class="toy" id="toy-rod" style="top: 65%; left: 38%;" onclick="goToToy(event, 'rod')">🎣</div>
      <div class="toy" id="toy-mouse" style="top: 40%; left: 55%;" onclick="goToToy(event, 'mouse')">🐭</div>

      <div class="cat" id="cat">
        <img id="catImg" src="https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-lie.png" alt="Симба">
      </div>
    </div>
  </div>

  <div class="hint visible" id="hint">Нажми на пол — Симба пойдёт туда!</div>
  <div class="action-text" id="actionText"></div>

<script>
  const IMG_LIE = 'https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-lie.png';
  const IMG_SIT = 'https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-sit.png';
  const IMG_WALK = 'https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-walk.png';
  const IMG_PLAY = 'https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-play.png';

  const TOY_NAMES = {
    yarn: 'клубком ниток 🧶',
    box: 'коробкой 📦',
    rod: 'удочкой 🎣',
    mouse: 'мышкой 🐭'
  };

  const CAT_WIDTH = 150;
  const CAT_HEIGHT = 110;

  const cat = document.getElementById('cat');
  const catImg = document.getElementById('catImg');
  const floor = document.getElementById('floor');
  const actionText = document.getElementById('actionText');
  const hint = document.getElementById('hint');
  const pillow = document.getElementById('pillow');

  let soundOn = true;
  let isMoving = false;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playMeow() {
    if (!soundOn) return;
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
    osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.4);
  }

  function playPurr() {
    if (!soundOn) return;
    initAudio();
    const bufferSize = audioCtx.sampleRate * 1.5;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 200;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
  }

  function toggleSound() {
    soundOn = !soundOn;
    document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  }

  function setCatImage(src) { catImg.src = src; }

  function showAction(text) {
    actionText.textContent = text;
    actionText.classList.add('visible');
    setTimeout(() => actionText.classList.remove('visible'), 2500);
  }

  function flipCat(direction) {
    if (direction === 'left') cat.classList.add('flipped');
    else cat.classList.remove('flipped');
  }

  function getCatPos() {
    const floorRect = floor.getBoundingClientRect();
    const catRect = cat.getBoundingClientRect();
    return {
      left: catRect.left - floorRect.left,
      top: catRect.top - floorRect.top
    };
  }

  function clampToFloor(x, y) {
    const floorRect = floor.getBoundingClientRect();
    
    const minX = 5;
    const maxX = floorRect.width - CAT_WIDTH - 5;
    x = Math.max(minX, Math.min(x, maxX));
    
    const minY = 5;
    const maxY = floorRect.height - CAT_HEIGHT - 5;
    y = Math.max(minY, Math.min(y, maxY));
    
    return { x, y };
  }

  function moveCatTo(targetX, targetY, callback) {
    if (isMoving) return;
    isMoving = true;

    const pos = getCatPos();
    const direction = targetX < pos.left ? 'left' : 'right';
    flipCat(direction);

    setCatImage(IMG_SIT);
    playMeow();

    setTimeout(() => {
      setCatImage(IMG_WALK);
      cat.classList.add('walking');

      const distance = Math.sqrt(
        Math.pow(targetX - pos.left, 2) + 
        Math.pow(targetY - pos.top, 2)
      );
      const duration = Math.max(600, distance * 2.5);

      cat.style.transition = `left ${duration}ms ease-in-out, top ${duration}ms ease-in-out`;
      cat.style.left = targetX + 'px';
      cat.style.top = targetY + 'px';

      setTimeout(() => {
        cat.classList.remove('walking');
        if (callback) callback();
        isMoving = false;
      }, duration);
    }, 300);
  }

  function goToPillow(event) {
    event.stopPropagation();
    if (isMoving) return;
    hideHint();

    const floorRect = floor.getBoundingClientRect();
    const pillowRect = pillow.getBoundingClientRect();
    
    const targetX = (pillowRect.left - floorRect.left) + (pillowRect.width / 2) - (CAT_WIDTH / 2);
    const targetY = (pillowRect.top - floorRect.top) + (pillowRect.height / 2) - (CAT_HEIGHT / 2);
    
    const clamped = clampToFloor(targetX, targetY);

    moveCatTo(clamped.x, clamped.y, () => {
      setCatImage(IMG_LIE);
      showAction('Симба отдыхает на подушке... 💤');
    });
  }

  function goToToy(event, toyName) {
    event.stopPropagation();
    if (isMoving) return;
    hideHint();

    const toy = document.getElementById('toy-' + toyName);
    const floorRect = floor.getBoundingClientRect();
    const toyRect = toy.getBoundingClientRect();
    
    const targetX = (toyRect.left - floorRect.left) + (toyRect.width / 2) - (CAT_WIDTH / 2);
    const targetY = (toyRect.top - floorRect.top) + (toyRect.height / 2) - (CAT_HEIGHT / 2);
    
    const clamped = clampToFloor(targetX, targetY);

    moveCatTo(clamped.x, clamped.y, () => {
      setCatImage(IMG_PLAY);
      cat.classList.add('playing');
      playPurr();
      showAction('Симба играет с ' + TOY_NAMES[toyName] + '!');
      
      setTimeout(() => {
        cat.classList.remove('playing');
        setCatImage(IMG_SIT);
      }, 3000);
    });
  }

  floor.addEventListener('click', (e) => {
    if (isMoving) return;
    if (e.target.closest('.toy') || e.target.id === 'pillow') return;
    hideHint();

    const floorRect = floor.getBoundingClientRect();
    const clickX = e.clientX - floorRect.left - (CAT_WIDTH / 2);
    const clickY = e.clientY - floorRect.top - (CAT_HEIGHT / 2);
    
    const clamped = clampToFloor(clickX, clickY);

    moveCatTo(clamped.x, clamped.y, () => {
      setCatImage(IMG_SIT);
      showAction('Симба сел и осматривается 👀');
    });
  });

  cat.addEventListener('click', (e) => {
    e.stopPropagation();
    if (isMoving) return;
    playMeow();
    showAction('Мяу! 🐱');
  });

  function hideHint() { hint.classList.remove('visible'); }
  setTimeout(hideHint, 4000);

  window.addEventListener('load', () => {
    const floorRect = floor.getBoundingClientRect();
    const pillowRect = pillow.getBoundingClientRect();
    
    const startX = (pillowRect.left - floorRect.left) + 5;
    const startY = (pillowRect.top - floorRect.top) - 20;
    
    const clamped = clampToFloor(startX, startY);
    
    cat.style.left = clamped.x + 'px';
    cat.style.top = clamped.y + 'px';
    cat.style.transition = 'none';
  });

  window.addEventListener('resize', () => {
    const pos = getCatPos();
    const clamped = clampToFloor(pos.left, pos.top);
    cat.style.transition = 'none';
    cat.style.left = clamped.x + 'px';
    cat.style.top = clamped.y + 'px';
  });
</script>

</body>
</html>
