<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Комната Симбы</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: Georgia, serif;
    background: #1a1510;
    display: flex;
    flex-direction: column;
  }

  .room-header {
    background: #1a1510;
    color: #f1e8db;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    z-index: 100;
    border-bottom: 2px solid #b84a2d;
    flex-shrink: 0;
  }
  .room-header h1 { font-size: 18px; font-weight: 400; }
  .room-header h1 em { color: #b84a2d; font-style: italic; }
  .back-btn {
    background: #b84a2d;
    color: #f1e8db;
    border: 2px solid #f1e8db;
    padding: 6px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    text-decoration: none;
  }
  .back-btn:active { transform: scale(0.95); }

  .room {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    min-height: 0;
  }

  .wall {
    position: absolute;
    top: 0;
    width: 100%;
    height: 50%;
    background: linear-gradient(to bottom, #e8dcc8 0%, #d4c4a8 100%);
    z-index: 1;
  }

  .floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 50%;
    background: repeating-linear-gradient(90deg, #8b7355 0px, #8b7355 60px, #7a6245 60px, #7a6245 62px);
    box-shadow: inset 0 20px 40px rgba(0,0,0,0.3);
    z-index: 2;
  }

  .rug {
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 35%;
    background: radial-gradient(ellipse, #b84a2d 0%, #963a22 60%, #7a2e1a 100%);
    border-radius: 50%;
    opacity: 0.7;
    border: 3px dashed #f1e8db;
    z-index: 2;
  }

  .window {
    position: absolute;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 90px;
    background: linear-gradient(to bottom, #87ceeb 0%, #b0e0e6 100%);
    border: 8px solid #5a4a3a;
    border-radius: 4px;
    box-shadow: inset 0 0 20px rgba(255,255,255,0.3), 0 4px 10px rgba(0,0,0,0.3);
    z-index: 2;
  }
  .window::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    width: 4px; height: 100%;
    background: #5a4a3a;
    transform: translateX(-50%);
  }
  .window::after {
    content: '';
    position: absolute;
    top: 50%; left: 0;
    width: 100%; height: 4px;
    background: #5a4a3a;
    transform: translateY(-50%);
  }
  .sun {
    position: absolute;
    top: 15%; right: 15%;
    width: 20px; height: 20px;
    background: #ffd700;
    border-radius: 50%;
    box-shadow: 0 0 15px #ffd700;
  }

  .shelf {
    position: absolute;
    top: 20%; left: 8%;
    width: 90px; height: 6px;
    background: #5a4a3a;
    border-radius: 2px;
    box-shadow: 0 3px 5px rgba(0,0,0,0.3);
    z-index: 2;
  }
  .book {
    position: absolute;
    bottom: 6px;
    width: 10px; height: 30px;
    border-radius: 2px;
  }
  .book:nth-child(1) { left: 8px; background: #b84a2d; }
  .book:nth-child(2) { left: 22px; background: #2a5a3a; }
  .book:nth-child(3) { left: 36px; background: #3a4a6a; }
  .book:nth-child(4) { left: 50px; background: #d9a441; }

  .picture {
    position: absolute;
    top: 12%; right: 12%;
    width: 60px; height: 70px;
    background: #f7f1e6;
    border: 5px solid #5a4a3a;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    z-index: 2;
  }

  .pillow {
    position: absolute;
    bottom: 8%;
    left: 8%;
    width: 100px;
    height: 50px;
    background: linear-gradient(135deg, #d9a441 0%, #b8862d 100%);
    border-radius: 50%;
    border: 3px solid #8b6a1a;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    cursor: pointer;
    z-index: 3;
  }

  .toy {
    position: absolute;
    font-size: 50px;
    cursor: pointer;
    z-index: 4;
    transition: transform 0.3s;
    filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.4));
  }
  .toy:active { transform: scale(1.3) rotate(10deg); }

  .cat {
    position: absolute;
    width: 280px;
    height: auto;
    z-index: 10;
    filter: drop-shadow(3px 5px 6px rgba(0,0,0,0.4));
    cursor: pointer;
  }
  .cat img {
    width: 100%;
    display: block;
  }
  .cat.walking {
    animation: bob 0.35s ease-in-out infinite;
  }
  .cat.flipped img {
    transform: scaleX(-1);
  }
  .cat.playing {
    animation: wiggle 0.5s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  .action-text {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(26, 21, 16, 0.92);
    color: #f1e8db;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 15px;
    font-family: Georgia, serif;
    font-style: italic;
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 20;
    pointer-events: none;
    border: 2px solid #b84a2d;
    white-space: nowrap;
  }
  .action-text.visible { opacity: 1; }

  .sound-toggle {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    margin-right: 10px;
  }

  .hint {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(184, 74, 45, 0.9);
    color: #f1e8db;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    z-index: 15;
    opacity: 0;
    transition: opacity 1s;
  }
  .hint.visible { opacity: 1; }
</style>
</head>
<body>

  <div class="room-header">
    <h1>Комната <em>Симбы</em> 🏠</h1>
    <div>
      <button class="sound-toggle" id="soundBtn" onclick="toggleSound()">🔊</button>
      <a href="simba-3.04.html" class="back-btn">← Назад</a>
    </div>
  </div>

  <div class="room" id="room">
    <div class="wall"></div>
    <div class="floor"></div>
    <div class="rug"></div>

    <div class="window"><div class="sun"></div></div>

    <div class="shelf">
      <div class="book"></div>
      <div class="book"></div>
      <div class="book"></div>
      <div class="book"></div>
    </div>

    <div class="picture">🐾</div>

    <div class="pillow" id="pillow" onclick="goToPillow(event)"></div>

    <!-- Игрушки на коврике -->
    <div class="toy" id="toy-yarn" style="bottom: 15%; right: 15%;" onclick="goToToy(event, 'yarn')">🧶</div>
    <div class="toy" id="toy-box" style="bottom: 22%; right: 35%;" onclick="goToToy(event, 'box')"></div>
    <div class="toy" id="toy-rod" style="bottom: 12%; left: 40%;" onclick="goToToy(event, 'rod')">🎣</div>
    <div class="toy" id="toy-mouse" style="bottom: 20%; left: 60%;" onclick="goToToy(event, 'mouse')">🐭</div>

    <div class="cat" id="cat">
      <img id="catImg" src="https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-lie.png" alt="Симба">
    </div>

    <div class="hint visible" id="hint">Нажми куда-нибудь — Симба пойдёт туда!</div>
    <div class="action-text" id="actionText"></div>
  </div>

<script>
  const IMG_LIE = 'https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-lie.png';
  const IMG_SIT = 'https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-sit.png';
  const IMG_WALK = 'https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-walk.png';
  const IMG_PLAY = 'https://github.com/CodeWave-pro/CodeWave-pro.github.io/raw/main/simba-play.png';

  const TOY_NAMES = {
    yarn: 'клубком ниток 🧶',
    box: 'коробкой 📦',
    rod: 'удочкой 🎣',
    mouse: 'мышкой 🐭'
  };

  const cat = document.getElementById('cat');
  const catImg = document.getElementById('catImg');
  const room = document.getElementById('room');
  const actionText = document.getElementById('actionText');
  const hint = document.getElementById('hint');
  const pillow = document.getElementById('pillow');

  let soundOn = true;
  let isMoving = false;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playMeow() {
    if (!soundOn) return;
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
    osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.4);
  }

  function playPurr() {
    if (!soundOn) return;
    initAudio();
    const bufferSize = audioCtx.sampleRate * 1.5;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 200;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
  }

  function toggleSound() {
    soundOn = !soundOn;
    document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  }

  function setCatImage(src) { catImg.src = src; }

  function showAction(text) {
    actionText.textContent = text;
    actionText.classList.add('visible');
    setTimeout(() => actionText.classList.remove('visible'), 2500);
  }

  function flipCat(direction) {
    if (direction === 'left') cat.classList.add('flipped');
    else cat.classList.remove('flipped');
  }

  function getCatPositionPercent() {
    const roomRect = room.getBoundingClientRect();
    const catRect = cat.getBoundingClientRect();
    const leftPercent = ((catRect.left - roomRect.left) / roomRect.width) * 100;
    const bottomPercent = ((roomRect.bottom - catRect.bottom) / roomRect.height) * 100;
    return { left: leftPercent, bottom: bottomPercent };
  }

  function clampToFloor(leftPercent, bottomPercent) {
    const maxBottom = 40;
    const minBottom = 2;
    bottomPercent = Math.max(minBottom, Math.min(bottomPercent, maxBottom));
    
    const maxLeft = 80;
    const minLeft = 2;
    leftPercent = Math.max(minLeft, Math.min(leftPercent, maxLeft));
    
    return { left: leftPercent, bottom: bottomPercent };
  }

  function moveCatToPercent(targetLeft, targetBottom, callback) {
    if (isMoving) return;
    isMoving = true;

    const pos = getCatPositionPercent();
    const direction = targetLeft < pos.left ? 'left' : 'right';
    flipCat(direction);

    setCatImage(IMG_SIT);
    playMeow();

    setTimeout(() => {
      setCatImage(IMG_WALK);
      cat.classList.add('walking');

      const distance = Math.sqrt(
        Math.pow(targetLeft - pos.left, 2) + 
        Math.pow(targetBottom - pos.bottom, 2)
      );
      const duration = Math.max(800, distance * 30);

      cat.style.transition = `left ${duration}ms ease-in-out, bottom ${duration}ms ease-in-out`;
      cat.style.left = targetLeft + '%';
      cat.style.bottom = targetBottom + '%';

      setTimeout(() => {
        cat.classList.remove('walking');
        if (callback) callback();
        isMoving = false;
      }, duration);
    }, 350);
  }

  function goToPillow(event) {
    event.stopPropagation();
    if (isMoving) return;
    hideHint();

    const roomRect = room.getBoundingClientRect();
    const pillowRect = pillow.getBoundingClientRect();
    
    const targetLeft = ((pillowRect.left - roomRect.left) / roomRect.width) * 100;
    const targetBottom = ((roomRect.bottom - pillowRect.bottom) / roomRect.height) * 100 + 5;
    
    const clamped = clampToFloor(targetLeft, targetBottom);

    moveCatToPercent(clamped.left, clamped.bottom, () => {
      setCatImage(IMG_LIE);
      showAction('Симба отдыхает на подушке... 💤');
    });
  }

  function goToToy(event, toyName) {
    event.stopPropagation();
    if (isMoving) return;
    hideHint();

    const toy = document.getElementById('toy-' + toyName);
    const roomRect = room.getBoundingClientRect();
    const toyRect = toy.getBoundingClientRect();
    
    const targetLeft = ((toyRect.left - roomRect.left) / roomRect.width) * 100 - 5;
    const targetBottom = ((roomRect.bottom - toyRect.bottom) / roomRect.height) * 100 + 10;
    
    const clamped = clampToFloor(targetLeft, targetBottom);

    moveCatToPercent(clamped.left, clamped.bottom, () => {
      setCatImage(IMG_PLAY);
      cat.classList.add('playing');
      playPurr();
      showAction('Симба играет с ' + TOY_NAMES[toyName] + '!');
      
      setTimeout(() => {
        cat.classList.remove('playing');
        setCatImage(IMG_SIT);
      }, 3000);
    });
  }

  room.addEventListener('click', (e) => {
    if (isMoving) return;
    if (e.target.closest('.toy') || e.target.id === 'pillow') return;
    hideHint();

    const roomRect = room.getBoundingClientRect();
    const clickLeft = ((e.clientX - roomRect.left) / roomRect.width) * 100;
    const clickBottom = ((roomRect.bottom - e.clientY) / roomRect.height) * 100;
    
    const clamped = clampToFloor(clickLeft, clickBottom);

    moveCatToPercent(clamped.left, clamped.bottom, () => {
      setCatImage(IMG_SIT);
      showAction('Симба сел и осматривается ');
    });
  });

  cat.addEventListener('click', (e) => {
    e.stopPropagation();
    if (isMoving) return;
    playMeow();
    showAction('Мяу! 🐱');
  });

  function hideHint() { hint.classList.remove('visible'); }
  setTimeout(hideHint, 5000);

  window.addEventListener('load', () => {
    cat.style.left = '5%';
    cat.style.bottom = '5%';
    cat.style.transition = 'none';
  });
</script>

</body>
</html>
