<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Симба браузер</title>
<style>
  :root {
    --cream: #f1e8db;
    --paper: #f7f1e6;
    --ink: #2a1d14;
    --rust: #b84a2d;
    --muted: #7a6a58;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: var(--cream);
    min-height: 100vh;
    padding: 30px 20px;
  }
  .wrap { max-width: 500px; margin: 0 auto; }

  .logo {
    text-align: center;
    margin-bottom: 40px;
  }
  .logo h1 {
    font-family: Georgia, serif;
    font-size: 48px;
    color: var(--ink);
    font-weight: 400;
  }
  .logo h1 em { color: var(--rust); font-style: italic; }
  .logo p {
    color: var(--muted);
    font-size: 15px;
    margin-top: 8px;
  }

  .search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
  }
  .search-box input {
    flex: 1;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 16px;
    color: var(--ink);
    outline: none;
  }
  .search-box input:focus { border-color: var(--rust); }
  .search-box button {
    background: var(--rust);
    color: var(--cream);
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 0 20px;
    font-size: 20px;
    font-weight: 700;
    box-shadow: 3px 3px 0 var(--ink);
    cursor: pointer;
  }
  .search-box button:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--ink);
  }

  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--muted);
    margin-bottom: 14px;
    font-weight: 600;
  }

  .links {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 30px;
  }
  .link-card {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 12px;
    padding: 18px 14px;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    transition: all 0.1s;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .link-card:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--ink);
  }
  .link-card .icon { font-size: 28px; }
  .link-card .label {
    font-size: 15px;
    font-weight: 600;
  }

  .footer {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-top: 40px;
  }
  .footer span { color: var(--rust); }
</style>
</head>
<body>
  <div class="wrap">

    <div class="logo">
      <h1>Симба <em>браузер</em></h1>
      <p>ваш тихий уголок в интернете</p>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Поиск в Google..." onkeypress="if(event.key==='Enter')search()">
      <button onclick="search()">→</button>
    </div>

    <div class="section-title">Быстрый доступ</div>
    <div class="links">
      <div class="link-card" onclick="openSite('https://google.com')">
        <div class="icon">🔍</div>
        <div class="label">Google</div>
      </div>
      <div class="link-card" onclick="openSite('https://yandex.ru')">
        <div class="icon">🌐</div>
        <div class="label">Яндекс</div>
      </div>
      <div class="link-card" onclick="openSite('https://youtube.com')">
        <div class="icon">📺</div>
        <div class="label">YouTube</div>
      </div>
      <div class="link-card" onclick="openSite('https://github.com')">
        <div class="icon"></div>
        <div class="label">GitHub</div>
      </div>
      <div class="link-card" onclick="openSite('https://wikipedia.org')">
        <div class="icon">📚</div>
        <div class="label">Википедия</div>
      </div>
      <div class="link-card" onclick="openSite('https://t.me')">
        <div class="icon">✈️</div>
        <div class="label">Telegram</div>
      </div>
    </div>

    <div class="footer">
      симба браузер <span>●</span> с 2026 года
    </div>

  </div>

<script>
  function openSite(url) {
    // Открываем в том же WebView (не в новой вкладке)
    window.location.href = url;
  }

  function search() {
    const q = document.getElementById('searchInput').value.trim();
    if (q) {
      window.location.href = 'https://google.com/search?q=' + encodeURIComponent(q);
    }
  }
</script>
  <script>
  // Перехватываем кнопку "Назад" на Android
  window.history.pushState(null, null, window.location.href);
  
  window.addEventListener('popstate', function() {
    // Возвращаемся на стартовую страницу Симбы
    window.location.href = 'https://codewave-pro.github.io/simba-browser.html';
  });
  </script>
</body>
</html>
