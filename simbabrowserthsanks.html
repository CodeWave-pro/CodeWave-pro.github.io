<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Спасибо — Симба браузер</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --cream: #f1e8db;
    --ink: #2a1d14;
    --rust: #b84a2d;
    --muted: #7a6a58;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(184,74,45,.08), transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(217,164,65,.10), transparent 50%);
  }

  .card {
    max-width: 420px;
    text-align: center;
    padding: 40px 28px;
  }

  .paw {
    width: 60px;
    height: 60px;
    margin: 0 auto 24px;
    opacity: .85;
    fill: var(--rust);
    transform: rotate(-12deg);
  }

  h1 {
    font-size: 32px;
    font-weight: 400;
    line-height: 1.1;
    margin-bottom: 16px;
    letter-spacing: -.01em;
  }

  h1 em {
    font-style: italic;
    color: var(--rust);
  }

  p {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    color: var(--muted);
    margin-bottom: 10px;
  }

  p b {
    color: var(--ink);
    font-weight: 600;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--rust);
    margin: 20px auto;
    opacity: .5;
  }

  .small {
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
</style>
</head>
<body>

  <div class="card">

    <svg class="paw" viewBox="0 0 100 100">
      <ellipse cx="50" cy="65" rx="22" ry="18"/>
      <ellipse cx="28" cy="40" rx="8" ry="11" transform="rotate(-20 28 40)"/>
      <ellipse cx="45" cy="28" rx="7" ry="10"/>
      <ellipse cx="62" cy="28" rx="7" ry="10"/>
      <ellipse cx="78" cy="42" rx="8" ry="11" transform="rotate(20 78 42)"/>
    </svg>

    <h1>Спасибо,<br>что <em>скачали</em> Симбу.</h1>

    <p>
      Файл уже у вас. Откройте его и разрешите установку — 
      дальше всё просто.
    </p>

    <p>
      Если что-то пойдёт не так — напишите нам. 
      Мы читаем каждое письмо.
    </p>

    <div class="divider"></div>

    <p class="small">симба браузер · с 2026 года</p>

  </div>

</body>
</html>
